<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanzaTrade - Professional Trading Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0A192F 0%, #172A45 100%);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #64FFDA, #00BFA5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .api-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .api-link {
            background: #64FFDA;
            color: #0A192F;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .api-link:hover {
            background: #00BFA5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">CanzaTrade</div>
        <div class="subtitle">Professional Trading Platform for African Markets</div>
        
        <div class="status">
            <h3>🚀 Deployment Status</h3>
            <p>Your CanzaTrade application is successfully deployed on Vercel!</p>
        </div>
        
        <div class="api-links">
            <a href="/api" class="api-link">API Status</a>
            <a href="/api/health" class="api-link">Health Check</a>
        </div>
        
        <div style="margin-top: 2rem; opacity: 0.7;">
            <p>Built with ❤️ for African markets and global traders</p>
        </div>
    </div>
</body>
</html>
